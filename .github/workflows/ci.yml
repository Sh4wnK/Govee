name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            examples/basic/go.sum
            examples/lanctl/go.sum
            cmd/govee/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test (with race detector)
        run: go test -race ./...

      - name: Build examples and CLI
        run: |
          go build ./...
          (cd examples/basic && go build ./...)
          (cd examples/lanctl && go build ./...)
          (cd cmd/govee && go build ./...)
